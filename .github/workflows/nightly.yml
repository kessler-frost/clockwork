name: Nightly Release

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last nightly
        id: check
        run: |
          # Find the most recent CalVer tag (20*)
          LAST_TAG=$(git tag -l '20*' --sort=-v:refname | head -n1)
          TAG=$(date -u +%Y.%m.%d)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if [ -z "$LAST_TAG" ]; then
            echo "No previous nightly tag found, will create first release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            # Check if there are commits since the last tag
            COMMITS=$(git rev-list ${LAST_TAG}..HEAD --count)
            if [ "$COMMITS" -gt 0 ]; then
              echo "Found $COMMITS commits since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

  create-tag:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create CalVer tag
        run: |
          TAG=${{ needs.check-changes.outputs.tag }}
          echo "Creating tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Nightly release $TAG"
          git push origin "$TAG"

  release:
    needs: [check-changes, create-tag]
    if: needs.check-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check-changes.outputs.tag }}
